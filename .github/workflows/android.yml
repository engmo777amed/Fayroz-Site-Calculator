name: Build Fayroz Site Calculator

on:
  push:
    branches: [ main, "feature/**", "rebuild/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: fayroz-site-calculator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fayroz-Site-Calculator-v5-Rebuild.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fayroz-Site-Calculator-v5-Rebuild
          path: Fayroz-Site-Calculator-v5-Rebuild.apk
          if-no-files-found: error
