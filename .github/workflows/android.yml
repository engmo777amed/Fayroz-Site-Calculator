name: Build Clean Fayroz Site Calculator

on:
  push:
    branches: [ "clean-rebuild-v1" ]
  workflow_dispatch:

concurrency:
  group: clean-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore approved Fayroz icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat brand/icon.part1 brand/icon.part2 brand/icon.part3 brand/icon.part4 | base64 -d > app/src/main/res/drawable-nodpi/fayroz_site_icon.png
          file app/src/main/res/drawable-nodpi/fayroz_site_icon.png
          test "$(wc -c < app/src/main/res/drawable-nodpi/fayroz_site_icon.png)" -gt 10000

      - name: Verify clean source tree
        shell: bash
        run: |
          test ! -f app/src/main/java/com/fayroz/sitecalculator/Screens.kt
          test ! -f app/src/main/java/com/fayroz/sitecalculator/ProjectScreens.kt
          test ! -f app/src/main/java/com/fayroz/sitecalculator/ProjectStore.kt
          test -f app/src/main/java/com/fayroz/sitecalculator/ui/HomeProjectScreens.kt
          test -f app/src/main/java/com/fayroz/sitecalculator/ui/CalculatorScreens.kt
          grep -q "fayroz_site_icon" app/src/main/java/com/fayroz/sitecalculator/ui/Components.kt

      - name: Build clean APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fayroz-Site-Calculator-Clean-Rebuild.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fayroz-Site-Calculator-Clean-Rebuild
          path: Fayroz-Site-Calculator-Clean-Rebuild.apk
          if-no-files-found: error
