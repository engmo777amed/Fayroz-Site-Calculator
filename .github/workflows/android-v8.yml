name: Build Fayroz Site Calculator V8
on:
  push:
    branches: [ "rebuild/site-v7-complete" ]
    paths:
      - "v8/**"
      - ".github/workflows/android-v8.yml"
  workflow_dispatch:
concurrency:
  group: fayroz-site-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-v8:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build V8 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fayroz-Site-Calculator-V8.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fayroz-Site-Calculator-V8
          path: v8/Fayroz-Site-Calculator-V8.apk
          if-no-files-found: error
