name: Verify and build Site Calculator V9
on:
  push:
    branches: [feature/site-v9-parts-cost-calculators]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-v9-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: v8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          disable-animations: true
          script: |
            cd v8; gradle :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace; test_status=$?; adb pull /sdcard/Android/data/com.fayroz.sitecalculator/files/screenshots ./screenshots; exit $test_status
      - name: Screenshots
        if: always()
        run: adb pull /sdcard/Download/site-v9-screenshots ./screenshots || true
      - name: Build APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Copy signing utility
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Site-V9-validation
          path: |
            v8/app/build/reports
            v8/app/build/test-results
            v8/app/build/outputs/androidTest-results
            v8/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: Fayroz-Site-Calculator-V9-unsigned
          path: |
            v8/app/build/outputs/apk
            v8/signing-tools
